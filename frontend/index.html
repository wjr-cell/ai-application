<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>AI Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        /* 登录界面 */

        #loginPage {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        #loginPage h1 {
            text-align: center;
        }

        #loginPage input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 15px;
        }

        #loginPage button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }

        /* 聊天界面 */

        #chatPage {
            display: none;
        }

        .layout {
            display: flex;
            height: 600px;
            border: 1px solid #ddd;
        }

        .sidebar {
            width: 220px;
            border-right: 1px solid #ddd;
            padding: 15px;
            box-sizing: border-box;
        }

        .sidebar>button {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
        }

        css .conversation {
            padding: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            border-radius: 5px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .conversation:hover {
            background: #f0f0f0;
        }

        .delete-conversation {
            border: none;
            background: transparent;
            cursor: pointer;

            font-size: 14px;

            padding: 3px 6px;

            opacity: 0.5;
        }

        .delete-conversation:hover {
            opacity: 1;
        }

        .main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        #chat {
            flex: 1;
            border: 1px solid #ddd;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message {
            margin: 15px 0;
        }

        .user {
            text-align: right;
        }

        .ai {
            text-align: left;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
        }

        .input-area button {
            padding: 10px 20px;
        }

        .sources {
            margin: 10px 0 20px 0;
            padding: 12px;
            background: #f7f7f7;
            border-left: 3px solid #888;
            font-size: 14px;
            color: #555;
        }

        #currentUser {
            font-size: 14px;
            margin-bottom: 10px;
            color: #555;
            word-break: break-all;
        }
    </style>

</head>


<body>


    <!-- ==================== 登录页面 ==================== -->

    <div id="loginPage">

        <h1>AI Chat</h1>

        <input id="usernameInput" type="text" placeholder="用户名">

        <input id="passwordInput" type="password" placeholder="密码">

        <button onclick="login()">
            登录
        </button>

        <button onclick="register()">
            注册
        </button>

    </div>


    <!-- ==================== 聊天页面 ==================== -->

    <div id="chatPage">

        <div class="layout">


            <!-- 左侧栏 -->

            <div class="sidebar">

                <div id="currentUser"></div>

                <button onclick="newConversation()">
                    + 新对话
                </button>

                <button onclick="uploadKnowledge()">
                    📚 上传知识文件
                </button>

                <button onclick="logout()">
                    退出登录
                </button>

                <input type="file" id="knowledgeFile" accept=".txt,.pdf" style="display: none;">

                <hr>

                <div id="conversationList"></div>

            </div>


            <!-- 主聊天区域 -->

            <div class="main">

                <h1>AI Chat</h1>

                <div id="chat"></div>

                <div class="input-area">

                    <input id="messageInput" placeholder="请输入消息" onkeydown="handleKeyDown(event)">

                    <button onclick="sendMessage()">
                        发送
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script>

        const API_BASE = "http://127.0.0.1:8000";

        let conversationId = null;


        /* ==================== JWT ==================== */

        function getToken() {

            return localStorage.getItem("access_token");

        }


        function getAuthHeaders() {

            const token = getToken();

            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            };

        }


        /* ==================== 登录 ==================== */

        async function login() {

            const username =
                document.getElementById(
                    "usernameInput"
                ).value.trim();

            const password =
                document.getElementById(
                    "passwordInput"
                ).value;

            if (!username || !password) {

                alert("请输入用户名和密码");

                return;
            }


            try {

                const response = await fetch(
                    `${API_BASE}/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.detail ||
                        "登录失败"
                    );

                    return;
                }


                localStorage.setItem(
                    "access_token",
                    data.access_token
                );

                localStorage.setItem(
                    "username",
                    data.username
                );

                localStorage.setItem(
                    "user_id",
                    data.user_id
                );


                showChatPage();


            } catch (error) {

                console.error(error);

                alert(
                    "登录失败，请确认 FastAPI 正在运行。"
                );
            }

        }


        /* ==================== 注册 ==================== */

        async function register() {

            const username =
                document.getElementById(
                    "usernameInput"
                ).value.trim();

            const password =
                document.getElementById(
                    "passwordInput"
                ).value;


            if (!username || !password) {

                alert("请输入用户名和密码");

                return;
            }


            try {

                const response = await fetch(
                    `${API_BASE}/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.detail ||
                        "注册失败"
                    );

                    return;
                }


                alert(
                    "注册成功，请登录"
                );


            } catch (error) {

                console.error(error);

                alert(
                    "注册失败，请确认 FastAPI 正在运行。"
                );
            }

        }


        /* ==================== 页面切换 ==================== */

        function showChatPage() {

            document.getElementById(
                "loginPage"
            ).style.display = "none";

            document.getElementById(
                "chatPage"
            ).style.display = "block";


            const username =
                localStorage.getItem(
                    "username"
                );

            document.getElementById(
                "currentUser"
            ).textContent =
                `当前用户：${username}`;


            init();

        }


        /* ==================== 退出登录 ==================== */

        function logout() {

            localStorage.removeItem(
                "access_token"
            );

            localStorage.removeItem(
                "username"
            );

            localStorage.removeItem(
                "user_id"
            );

            localStorage.removeItem(
                "conversationId"
            );


            conversationId = null;


            document.getElementById(
                "chat"
            ).innerHTML = "";

            document.getElementById(
                "conversationList"
            ).innerHTML = "";


            document.getElementById(
                "chatPage"
            ).style.display = "none";

            document.getElementById(
                "loginPage"
            ).style.display = "block";

        }


        /* ==================== 上传知识 ==================== */

        async function uploadKnowledge() {

            const fileInput =
                document.getElementById(
                    "knowledgeFile"
                );

            fileInput.click();


            fileInput.onchange =
                async function () {

                    const file =
                        fileInput.files[0];


                    if (!file) {

                        return;
                    }


                    const formData =
                        new FormData();


                    formData.append(
                        "file",
                        file
                    );


                    try {

                        const response =
                            await fetch(
                                `${API_BASE}/knowledge/upload`,
                                {
                                    method: "POST",
                                    headers: {
                                        "Authorization":
                                            `Bearer ${getToken()}`
                                    },
                                    body: formData
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            alert(
                                data.detail ||
                                "上传失败"
                            );

                            return;
                        }


                        if (data.error) {

                            alert(data.error);

                            return;
                        }


                        alert(
                            `知识文件上传成功：${data.filename}`
                        );


                    } catch (error) {

                        console.error(error);

                        alert(
                            "上传失败，请确认 FastAPI 正在运行。"
                        );
                    }

                };

        }


        /* ==================== 创建会话 ==================== */

        async function createConversation() {

            const response =
                await fetch(
                    `${API_BASE}/conversations`,
                    {
                        method: "POST",

                        headers:
                            getAuthHeaders(),

                        body: JSON.stringify({
                            title: "新对话"
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                alert(
                    data.detail ||
                    "创建会话失败"
                );

                return;
            }


            /*
             * 后端现在返回的是 id
             * 不是 conversation_id
             */

            conversationId =
                data.id;


            localStorage.setItem(
                "conversationId",
                conversationId
            );


            console.log(
                "创建会话成功:",
                conversationId
            );

        }


        /* ==================== 加载聊天历史 ==================== */

        async function loadHistory() {

            if (conversationId === null) {

                return;
            }


            const response =
                await fetch(
                    `${API_BASE}/chat/history/${conversationId}`,
                    {
                        headers: {
                            "Authorization":
                                `Bearer ${getToken()}`
                        }
                    }
                );


            const history =
                await response.json();


            if (!response.ok) {

                alert(
                    history.detail ||
                    "加载聊天历史失败"
                );

                return;
            }


            for (const item of history) {

                addMessage(
                    "user",
                    item.user_message
                );


                addMessage(
                    "ai",
                    item.ai_reply
                );

            }

        }


        /* ==================== 发送消息 ==================== */

        async function sendMessage() {

            const input =
                document.getElementById(
                    "messageInput"
                );


            const message =
                input.value.trim();


            if (!message) {

                return;
            }


            if (conversationId === null) {

                alert(
                    "会话还没有创建完成，请稍等"
                );

                return;
            }


            addMessage(
                "user",
                message
            );


            input.value = "";


            try {

                const response =
                    await fetch(
                        `${API_BASE}/chat`,
                        {
                            method: "POST",

                            headers:
                                getAuthHeaders(),

                            body: JSON.stringify({
                                conversation_id:
                                    conversationId,

                                message:
                                    message
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.detail ||
                        "聊天请求失败"
                    );

                    return;
                }


                addMessage(
                    "ai",
                    data.reply
                );


                if (
                    data.sources &&
                    data.sources.length > 0
                ) {

                    addSources(
                        data.sources
                    );

                }


                await loadConversations();


            } catch (error) {

                console.error(error);

                alert(
                    "聊天失败，请确认 FastAPI 正在运行。"
                );
            }

        }


        /* ==================== 回车发送 ==================== */

        function handleKeyDown(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }


        /* ==================== 显示消息 ==================== */

        function addMessage(
            role,
            message
        ) {

            const chatBox =
                document.getElementById(
                    "chat"
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "message " + role;


            if (role === "user") {

                div.textContent =
                    "你：" + message;

            } else {

                div.textContent =
                    "AI：" + message;

            }


            chatBox.appendChild(div);


            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        /* ==================== 显示 RAG 来源 ==================== */

        function addSources(
            sources
        ) {

            const chatBox =
                document.getElementById(
                    "chat"
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "sources";


            let html =
                "<strong>📚 参考知识</strong><br><br>";


            for (const item of sources) {

                html += `
                    <div>
                        <strong>
                            ${item.source}
                        </strong>

                        （相似度：
                        ${item.score.toFixed(4)}
                        ）

                        <br>

                        ${item.content}
                    </div>

                    <br>
                `;

            }


            div.innerHTML =
                html;


            chatBox.appendChild(div);


            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        /* ==================== 加载会话列表 ==================== */

        async function loadConversations() {

            const response =
                await fetch(
                    `${API_BASE}/conversations`,
                    {
                        headers: {
                            "Authorization":
                                `Bearer ${getToken()}`
                        }
                    }
                );


            const conversations =
                await response.json();


            if (!response.ok) {

                alert(
                    conversations.detail ||
                    "加载会话失败"
                );

                return;
            }


            const list =
                document.getElementById(
                    "conversationList"
                );


            list.innerHTML = "";


            for (
                const conversation
                of conversations
            ) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "conversation";


                /* ==================== 会话标题 ==================== */

                const title =
                    document.createElement(
                        "span"
                    );

                title.textContent =
                    conversation.title;


                /* ==================== 删除按钮 ==================== */

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.textContent =
                    "🗑";


                deleteButton.className =
                    "delete-conversation";


                deleteButton.onclick =
                    async function (event) {

                        /*
                         * 阻止点击删除按钮时
                         * 同时触发切换会话
                         */
                        event.stopPropagation();


                        const confirmed =
                            confirm(
                                "确定要删除这个会话吗？\n聊天记录也会被删除。"
                            );


                        if (!confirmed) {

                            return;
                        }


                        const response =
                            await fetch(
                                `${API_BASE}/conversations/${conversation.id}`,
                                {
                                    method: "DELETE",

                                    headers: {
                                        "Authorization":
                                            `Bearer ${getToken()}`
                                    }
                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            alert(
                                result.detail ||
                                "删除会话失败"
                            );

                            return;
                        }


                        /*
                         * 如果删除的是当前会话
                         */
                        if (
                            conversationId ===
                            conversation.id
                        ) {

                            conversationId =
                                null;


                            localStorage.removeItem(
                                "conversationId"
                            );


                            document.getElementById(
                                "chat"
                            ).innerHTML = "";
                        }


                        /*
                         * 重新加载会话列表
                         */
                        await loadConversations();


                        /*
                         * 如果当前没有会话，
                         * 自动创建一个新的
                         */
                        if (
                            conversationId === null
                        ) {

                            await createConversation();

                            await loadConversations();

                        }

                    };


                div.appendChild(title);

                div.appendChild(deleteButton);


                /* ==================== 点击会话 ==================== */

                div.onclick =
                    function () {

                        switchConversation(
                            conversation.id
                        );

                    };


                list.appendChild(div);

            }

        }



        /* ==================== 切换会话 ==================== */

        async function switchConversation(
            id
        ) {

            conversationId =
                id;


            localStorage.setItem(
                "conversationId",
                conversationId
            );


            const chat =
                document.getElementById(
                    "chat"
                );


            chat.innerHTML = "";


            await loadHistory();

        }


        /* ==================== 创建新对话 ==================== */

        async function newConversation() {

            await createConversation();


            if (
                conversationId === null
            ) {

                return;
            }


            document.getElementById(
                "chat"
            ).innerHTML = "";


            await loadConversations();

        }


        /* ==================== 页面初始化 ==================== */

        async function init() {

            const savedConversationId =
                localStorage.getItem(
                    "conversationId"
                );


            if (savedConversationId) {

                conversationId =
                    parseInt(
                        savedConversationId
                    );


                console.log(
                    "恢复会话:",
                    conversationId
                );


                /*
                 * 尝试加载历史。
                 * 如果这个旧会话不属于当前用户，
                 * 后端会返回 403。
                 */

                const response =
                    await fetch(
                        `${API_BASE}/chat/history/${conversationId}`,
                        {
                            headers: {
                                "Authorization":
                                    `Bearer ${getToken()}`
                            }
                        }
                    );


                if (response.ok) {

                    const history =
                        await response.json();


                    for (
                        const item
                        of history
                    ) {

                        addMessage(
                            "user",
                            item.user_message
                        );


                        addMessage(
                            "ai",
                            item.ai_reply
                        );

                    }

                } else {

                    /*
                     * 旧会话不属于当前用户，
                     * 清除旧的 conversationId。
                     */

                    conversationId =
                        null;


                    localStorage.removeItem(
                        "conversationId"
                    );

                }

            }


            await loadConversations();


            /*
             * 如果当前用户还没有会话，
             * 自动创建一个。
             */

            if (
                conversationId === null
            ) {

                await createConversation();

                await loadConversations();

            }

        }


        /* ==================== 页面首次打开 ==================== */

        function checkLogin() {

            const token =
                getToken();


            if (token) {

                showChatPage();

            } else {

                document.getElementById(
                    "loginPage"
                ).style.display =
                    "block";

                document.getElementById(
                    "chatPage"
                ).style.display =
                    "none";

            }

        }


        checkLogin();

    </script>

</body>

</html>
